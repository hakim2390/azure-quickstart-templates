# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
    - master
    - main
  paths:
    include:
    - quickstarts/microsoft.storage/storage-account-create/*

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: AzureResourceManagerTemplateDeployment@3
  displayName: 'Deploy Storage Account ARM Template'
  inputs:
    deploymentScope: 'Resource Group'
    azureResourceManagerConnection: 'Azure-ARM-Connection'
    subscriptionId: 'e205edf9-df4c-4aad-83c0-3bc0f2d466c7'
    action: 'Create Or Update Resource Group'
    resourceGroupName: 'VisualStudioOnline-2E098C01EF8141729D3E858D9BD37C2F'
    location: 'South India'
    templateLocation: 'Linked artifact'
    csmFile: 'quickstarts/microsoft.storage/storage-account-create/azuredeploy.json'
    csmParametersFile: 'quickstarts/microsoft.storage/storage-account-create/azuredeploy.parameters.json'
    overrideParameters: '-storageAccountName "storage$(Build.BuildId)lab"'